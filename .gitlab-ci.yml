image: node:20-alpine

# Cache dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/node_modules/
    - backend/node_modules/

stages:
  - lint
  - build
  - test

# Linting stage for both frontend and backend
lint-backend:
  stage: lint
  tags: 
    - docker
  script:
    - cd backend
    - npm ci
    - npx eslint . 


lint-frontend:
  stage: lint
  tags: 
    - docker
  script:
    - cd frontend
    - npm ci
    - npx eslint . 

# Build stage for the frontend
build-frontend:
  stage: build
  tags:
    - docker
  script:
    - cd frontend
    - npm ci
    - npm run build 

# Backend tests
test-backend:
  stage: test
  tags:
    - docker
  services:
    - name: mvertes/alpine-mongo:latest
      alias: mongo
    - name: eclipse-mosquitto:latest
      alias: mqtt
      command: ["sh", "-c", "
        echo 'listener 1883 0.0.0.0' >> /mosquitto/config/mosquitto.conf && \
        echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && \
        mosquitto -c /mosquitto/config/mosquitto.conf"]
  variables:
    PATIENTDB_PRIMARY_URI: "mongodb://mongo:27017/patients"
    DENTISTDB_PRIMARY_URI: "mongodb://mongo:27017/dentists"
    APPOINTMENTDB_PRIMARY_URI: "mongodb://mongo:27017/appointments"
    CLINICDB_PRIMARY_URI: "mongodb://mongo:27017/clinics"
    MQTT_BROKER_URL_BACKEND: "mqtt://mqtt:1883"
    PORT_DENTIST_API: 5007 
    PORT_GATEWAY: 3000

  script:
    - cd backend
    - npm ci
    - echo "Creating .env file for tests"
    - echo "MONGODB_URI_PATIENTS=$MONGODB_URI_PATIENTS" > ../.env
    - echo "MONGODB_URI_DENTISTS=$MONGODB_URI_DENTISTS" >> ../.env
    - echo "MONGODB_URI_APPOINTMENTS=$MONGODB_URI_APPOINTMENTS" >> ../.env
    - echo "MONGODB_URI_CLINICS=$MONGODB_URI_CLINICS" >> ../.env
    - echo "MQTT_BROKER_URL_BACKEND=$MQTT_BROKER_URL_BACKEND" >> ../.env
    - echo "PORT_DENTIST_API=$PORT_DENTIST_API" >> ../.env
    - echo "PORT_GATEWAY=$PORT_GATEWAY" >> ../.env
    - npm run ci-test

  artifacts:
    when: always
    paths:
      - backend/coverage/ # Collect Jest coverage reports
  
  coverage: '/^Statements\s+:\s+(\d+\.\d+)%/' # Parse coverage percentage from Jest output
