image: node:20-alpine


stages:
  - setup

variables:
  NODE_ENV: test
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend

cache:
  paths:
    - node_modules/

setup:
  stage: setup
  tags:
    - docker
  script:
    - npm install
    - cd $FRONTEND_DIR && npm install && cd ..
    - cd $BACKEND_DIR && npm install && cd ..

