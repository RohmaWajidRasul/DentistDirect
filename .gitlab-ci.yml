image: node:20-alpine

# Cache dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - frontend/node_modules/
    - backend/node_modules/

stages:
  - lint
  - build
  - test

# Linting stage for both frontend and backend
lint-backend:
  stage: lint
  tags: 
    - docker
  script:
    - cd backend
    - npm ci
    - npx eslint . 


lint-frontend:
  stage: lint
  tags: 
    - docker
  script:
    - cd frontend
    - npm ci
    - npx eslint . 

# Build stage for the frontend
build-frontend:
  stage: build
  tags:
    - docker
  script:
    - cd frontend
    - npm ci
    - npm run build 

# Backend tests
test-backend:
  stage: test
  tags:
    - docker
  services:
    - name: mvertes/alpine-mongo:latest
      alias: mongo
    - name: eclipse-mosquitto:latest
      alias: mqtt
  variables:
    PATIENTDB_PRIMARY_URI: "mongodb://mongo:27017/patients"
    DENTISTDB_PRIMARY_URI: "mongodb://mongo:27017/dentists"
    APPOINTMENTDB_PRIMARY_URI: "mongodb://mongo:27017/appointments"
    MQTT_BROKER_URL_BACKEND: "mqtt://mqtt:1883"
  script:
    - cd backend
    - npm ci
    - echo "Creating .env file for tests"
    - echo "MONGODB_URI_PATIENTS=$MONGODB_URI_PATIENTS" > ../.env
    - echo "MONGODB_URI_DENTISTS=$MONGODB_URI_DENTISTS" >> ../.env
    - echo "MONGODB_URI_APPOINTMENTS=$MONGODB_URI_APPOINTMENTS" >> ../.env
    - echo "MQTT_BROKER_URL_BACKEND=$MQTT_BROKER_URL_BACKEND" >> ../.env
    - npm run ci-test

